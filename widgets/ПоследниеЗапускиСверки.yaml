name: ПоследниеЗапускиСверки
type: list
title: Последние запуски сверки
limit: 15
query: |
  ВЫБРАТЬ ПЕРВЫЕ 15
    Запуски.Ссылка КАК Ссылка,
    Запуски.Дата КАК Дата,
    Запуски.Настройка.Наименование КАК Настройка,
    Запуски.КонецПериода КАК НаДату,
    Запуски.КлючейСовпало КАК Совпало,
    Запуски.КлючейРасходится КАК Расходится,
    Запуски.Состояние КАК Состояние
  ИЗ Документ.ЗапускСверки КАК Запуски
  УПОРЯДОЧИТЬ ПО Запуски.Дата УБЫВ
columns:
  - {field: Дата, label: Запуск}
  - {field: Настройка, label: Настройка}
  - {field: НаДату, label: На дату}
  - {field: Совпало, label: Совпало, align: right}
  - {field: Расходится, label: Расходится, align: right}
  - {field: Состояние, label: Состояние}
